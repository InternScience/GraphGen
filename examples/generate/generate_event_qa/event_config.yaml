global_params:
  working_dir: cache
  graph_backend: kuzu # graph database backend, support: kuzu, networkx
  kv_backend: rocksdb # key-value store backend, support: rocksdb, json_kv

nodes:
  - id: read
    op_name: read
    type: source
    dependencies: []
    params:
      input_path:
        - examples/input_examples/csv_demo.csv

  - id: chunk
    op_name: chunk
    type: map_batch
    dependencies:
      - read
    execution_params:
      replicas: 4
    params:
      chunk_size: 1024
      chunk_overlap: 100

  - id: build_kg
    op_name: build_kg
    type: map_batch
    dependencies:
      - chunk
    execution_params:
      replicas: 1
      batch_size: 128
    params:
      kg_method: event_entity # opt-in; default is light_rag
      # built-in profile id, or a path to a profile.json (prompt.txt next to it)
      event_profile: generic_event.v1

  - id: partition
    op_name: partition
    type: aggregate
    dependencies:
      - build_kg
    params:
      method: event_join
      method_params:
        max_events_per_community: 6
        min_events_per_community: 1
        max_tokens_per_community: 4096
        # set to true only with a profile whose anchor.required is true
        require_same_anchor: false

  - id: generate
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 1
      batch_size: 128
    save_output: true
    params:
      method: multi_hop
      data_format: ChatML
